apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sreadonlyrootfilesystem
  annotations:
    description: Requires containers to use a read-only root filesystem.
spec:
  crd:
    spec:
      names:
        kind: K8sReadOnlyRootFilesystem
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sreadonlyrootfilesystem

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.securityContext.readOnlyRootFilesystem
          msg := sprintf("Container '%v' must set readOnlyRootFilesystem=true", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          c.securityContext.readOnlyRootFilesystem == false
          msg := sprintf("Container '%v' must set readOnlyRootFilesystem=true", [c.name])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
