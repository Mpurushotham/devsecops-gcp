apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8shostfilesystem
  annotations:
    description: Prevents containers from mounting host paths.
spec:
  crd:
    spec:
      names:
        kind: K8sHostFilesystem
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedHostPaths:
              type: array
              items:
                type: object
                properties:
                  pathPrefix:
                    type: string
                  readOnly:
                    type: boolean
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8shostfilesystem

        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          not path_allowed(volume.hostPath.path)
          msg := sprintf("hostPath volume '%v' with path '%v' is not allowed",
            [volume.name, volume.hostPath.path])
        }

        path_allowed(path) {
          allowed := input.parameters.allowedHostPaths[_]
          startswith(path, allowed.pathPrefix)
        }
