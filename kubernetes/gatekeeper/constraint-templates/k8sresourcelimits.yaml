apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sresourcelimits
  annotations:
    description: Requires CPU and memory limits and requests on all containers.
spec:
  crd:
    spec:
      names:
        kind: K8sResourceLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sresourcelimits

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.limits.cpu
          msg := sprintf("Container '%v' must set resources.limits.cpu", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.limits.memory
          msg := sprintf("Container '%v' must set resources.limits.memory", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.requests.cpu
          msg := sprintf("Container '%v' must set resources.requests.cpu", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.requests.memory
          msg := sprintf("Container '%v' must set resources.requests.memory", [c.name])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
