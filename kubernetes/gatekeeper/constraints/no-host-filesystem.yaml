apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sHostFilesystem
metadata:
  name: no-host-filesystem
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
  parameters:
    allowedHostPaths: []
