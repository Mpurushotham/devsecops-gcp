name: "01 - IaC Security Scanning"

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  security-events: write

jobs:
  # tfsec is deprecated upstream; its checks now ship in `trivy config`.
  trivy-config:
    name: "Trivy — IaC misconfiguration"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-config-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  checkov:
    name: "Checkov"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
          quiet: true
          # Pre-existing findings are tracked in the baseline; new ones fail.
          baseline: terraform/.checkov.baseline
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov-results.sarif') != ''
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  infracost:
    name: "Cost Estimation"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when INFRACOST_API_KEY is not configured
        if: env.INFRACOST_API_KEY == ''
        run: echo "::notice::INFRACOST_API_KEY not set; skipping cost estimate."
      - uses: infracost/actions/setup@v3
        if: env.INFRACOST_API_KEY != ''
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Generate Infracost diff
        if: env.INFRACOST_API_KEY != ''
        run: |
          infracost breakdown \
            --path=terraform/environments/dev \
            --format=json \
            --out-file=/tmp/infracost.json
      # infracost/actions/comment does not exist; the CLI posts the comment.
      - name: Post Infracost comment
        if: env.INFRACOST_API_KEY != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" \
            --pull-request="$PR_NUMBER" \
            --github-token="$GITHUB_TOKEN" \
            --behavior=update
