name: "03 - SCA (Software Composition Analysis)"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  trivy-filesystem:
    name: "Trivy — Filesystem"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  # OWASP Dependency-Check needs an NVD API key and its Python analyzer is
  # experimental; pip-audit checks the same requirements files against PyPA/OSV.
  pip-audit:
    name: "pip-audit — ${{ matrix.function }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        function: [iam-drift-remediation, scc-auto-response]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit dependencies
        run: |
          pip install --quiet pip-audit
          pip-audit -r cloud-functions/${{ matrix.function }}/requirements.txt \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-1805  # protobuf: fix needs google-cloud-* major upgrade
