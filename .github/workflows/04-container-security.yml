name: "04 - Container Security"

on:
  pull_request:
    paths:
      - "cloud-functions/**"
      - "**/Dockerfile"
      - "**/*.dockerfile"
  push:
    branches: [main]
    paths:
      - "cloud-functions/**"
      - "**/Dockerfile"
      - "**/*.dockerfile"

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

env:
  AR_REGION: us-central1
  AR_HOST: us-central1-docker.pkg.dev

jobs:
  build-scan-push:
    name: "Build → Scan → Attest → Push"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app:
          - name: scc-auto-response
            context: cloud-functions/scc-auto-response
            dockerfile: cloud-functions/scc-auto-response/Dockerfile

    env:
      IMAGE_NAME: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ matrix.app.name }}
      IMAGE_TAG: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ matrix.app.name }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: false
          tags: ${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Trivy — Container image scan"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: "Grype — Container image scan"
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: grype

      - name: "Generate SBOM with Syft"
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      # Only push and attest on pushes to main (not PRs)
      - name: Authenticate to GCP via WIF
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.IMAGE_PUSH_SA }}

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: gcloud auth configure-docker ${{ env.AR_REGION }}-docker.pkg.dev --quiet

      - name: Push image to Artifact Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push ${{ env.IMAGE_TAG }}

      - name: Get image digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_TAG }})
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM to image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cosign sign --yes ${{ env.IMAGE_TAG }}

      - name: Create Binary Authorization attestation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="${{ steps.digest.outputs.digest }}" \
            --attestor="projects/${{ vars.GCP_PROJECT_ID }}/attestors/${{ vars.BINAUTHZ_ATTESTOR }}" \
            --keyversion="${{ vars.BINAUTHZ_KMS_KEY_VERSION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"
